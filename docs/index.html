<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ERCOT BESS — DA vs RT Backtest</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root { --bg:#0f1419; --card:#1a2129; --txt:#e6edf3; --mut:#8b98a5; --hen:#4f9dff; --peer:#ff8c42; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:20px 28px; border-bottom:1px solid #283039; }
  h1 { margin:0; font-size:18px; }
  .sub { color:var(--mut); margin-top:4px; }
  .wrap { padding:24px 28px; display:grid; gap:24px; grid-template-columns:1fr 1fr; }
  .card { background:var(--card); border:1px solid #283039; border-radius:12px; padding:18px; }
  .card.full { grid-column:1 / -1; }
  h2 { margin:0 0 14px; font-size:14px; color:var(--mut); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:right; padding:7px 10px; border-bottom:1px solid #283039; }
  th:first-child, td:first-child { text-align:left; }
  .hen { color:var(--hen); font-weight:600; }
  .peer { color:var(--peer); }
  .pill { display:inline-block; font-size:11px; padding:1px 8px; border-radius:10px; }
  .pill.hen { background:rgba(79,157,255,.15); }
  .pill.peer { background:rgba(255,140,66,.15); }
</style>
</head>
<body>
<header>
  <h1>ERCOT Battery Backtest — Day-Ahead vs Real-Time</h1>
  <div class="sub">HEN assets vs ERCOT peers · settled DA + RT revenue · <span id="updated">loading…</span></div>
</header>
<div class="wrap">
  <div class="card full"><h2>Monthly total revenue per MW</h2><canvas id="perMw" height="90"></canvas></div>
  <div class="card"><h2>HEN vs Peers — avg $/MW (latest month)</h2><canvas id="ownerBar" height="160"></canvas></div>
  <div class="card"><h2>DA vs RT split (latest month, $)</h2><canvas id="split" height="160"></canvas></div>
  <div class="card full"><h2>Latest-month leaderboard ($/MW)</h2><div id="board"></div></div>
</div>
<script>
const fmt = n => (n==null||isNaN(n)) ? "—" : "$"+Number(n).toLocaleString(undefined,{maximumFractionDigits:0});
const HEN="#4f9dff", PEER="#ff8c42";

fetch("dashboard.json").then(r=>r.json()).then(d=>{
  const monthly = d.monthly || [];
  if(!monthly.length){ document.getElementById("updated").textContent="no data yet — first Actions run pending"; return; }
  const months = [...new Set(monthly.map(m=>m.period))].sort();
  const latest = months[months.length-1];
  document.getElementById("updated").textContent = "through "+latest;

  // Per-MW line over months, one series per battery
  const byBat = {};
  monthly.forEach(m=>{ (byBat[m.name] ||= {owner:m.owner, pts:{}}).pts[m.period]=m.total_rev_per_mw; });
  const datasets = Object.entries(byBat).map(([name,v])=>({
    label:name, data:months.map(mo=>v.pts[mo]??null),
    borderColor: v.owner==="HEN"?HEN:PEER, borderWidth:v.owner==="HEN"?2.5:1,
    tension:.25, pointRadius:2,
  }));
  new Chart(perMw,{type:"line",data:{labels:months,datasets},
    options:{plugins:{legend:{labels:{color:"#8b98a5",boxWidth:10}}},
      scales:{x:{ticks:{color:"#8b98a5"}},y:{ticks:{color:"#8b98a5",callback:fmt}}}}});

  const cur = monthly.filter(m=>m.period===latest);
  // Owner averages
  const owners={}; cur.forEach(m=>{(owners[m.owner] ||= []).push(m.total_rev_per_mw);});
  const oLabels=Object.keys(owners), oVals=oLabels.map(o=>owners[o].reduce((a,b)=>a+b,0)/owners[o].length);
  new Chart(ownerBar,{type:"bar",data:{labels:oLabels,datasets:[{data:oVals,
    backgroundColor:oLabels.map(o=>o==="HEN"?HEN:PEER)}]},
    options:{plugins:{legend:{display:false}},scales:{x:{ticks:{color:"#8b98a5"}},y:{ticks:{color:"#8b98a5",callback:fmt}}}}});

  // DA vs RT split
  const da=cur.reduce((a,m)=>a+(m.da_rev||0),0), rt=cur.reduce((a,m)=>a+(m.rt_rev||0),0);
  new Chart(split,{type:"doughnut",data:{labels:["DA revenue","RT (deviation)"],
    datasets:[{data:[da,rt],backgroundColor:[HEN,PEER]}]},
    options:{plugins:{legend:{labels:{color:"#8b98a5"}}}}});

  // Leaderboard
  const rows=[...cur].sort((a,b)=>b.total_rev_per_mw-a.total_rev_per_mw);
  let html="<table><tr><th>#</th><th>Battery</th><th>Owner</th><th>$/MW</th><th>DA $</th><th>RT $</th><th>Total $</th></tr>";
  rows.forEach((m,i)=>{ const cls=m.owner==="HEN"?"hen":"peer";
    html+=`<tr><td>${i+1}</td><td class="${cls}">${m.name}</td>`+
          `<td><span class="pill ${cls}">${m.owner}</span></td>`+
          `<td>${fmt(m.total_rev_per_mw)}</td><td>${fmt(m.da_rev)}</td>`+
          `<td>${fmt(m.rt_rev)}</td><td>${fmt(m.total_rev)}</td></tr>`; });
  document.getElementById("board").innerHTML=html+"</table>";
}).catch(e=>{document.getElementById("updated").textContent="error loading dashboard.json";});
</script>
</body>
</html>
