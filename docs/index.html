<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HEN BESS — DA vs RT Backtest</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root { --bg:#0f1419; --card:#1a2129; --txt:#e6edf3; --mut:#8b98a5; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:20px 28px; border-bottom:1px solid #283039; }
  h1 { margin:0; font-size:18px; }
  .sub { color:var(--mut); margin-top:4px; }
  .wrap { padding:24px 28px; display:grid; gap:24px; grid-template-columns:1fr 1fr; }
  .card { background:var(--card); border:1px solid #283039; border-radius:12px; padding:18px; }
  .card.full { grid-column:1 / -1; }
  h2 { margin:0 0 14px; font-size:13px; color:var(--mut); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:right; padding:7px 10px; border-bottom:1px solid #283039; }
  th:first-child, td:first-child { text-align:left; }
  .hen { color:#4f9dff; font-weight:600; }
  .pill { display:inline-block; font-size:11px; padding:1px 8px; border-radius:10px; background:#283039; }
</style>
</head>
<body>
<header>
  <h1>HEN Battery Backtest — Day-Ahead vs Real-Time</h1>
  <div class="sub">HEN vs ERCOT peers, by storage duration · settled DA + RT revenue · <span id="updated">loading…</span></div>
</header>
<div class="wrap">
  <div class="card full"><h2>Average $/MW by group, monthly</h2><canvas id="line" height="90"></canvas></div>
  <div class="card"><h2>HEN — YTD revenue: DA vs RT by duration</h2><canvas id="henPie" height="200"></canvas></div>
  <div class="card"><h2>Peers — YTD revenue: DA vs RT by duration</h2><canvas id="peerPie" height="200"></canvas></div>
  <div class="card full"><h2>Latest-month leaderboard ($/MW)</h2><div id="board"></div></div>
</div>
<script>
const fmt = n => (n==null||isNaN(n)) ? "—" : "$"+Number(n).toLocaleString(undefined,{maximumFractionDigits:0});
const STYLE = {
  "Hen 1hr":  {c:"#4f9dff", dash:[]},
  "Hen 2hr":  {c:"#7fc4ff", dash:[6,4]},
  "Peer 1hr": {c:"#ff8c42", dash:[]},
  "Peer 2hr": {c:"#ffb784", dash:[6,4]},
};
const label = g => g.replace("Hen","HEN").replace("Peer","Peers");
// Pie slice colors: DA = blues, RT = oranges; 1hr bright, 2hr darker.
const PIE_COLORS = ["#4f9dff", "#ff8c42", "#2f6fcc", "#cc6a2f"];
const PIE_LABELS = ["1hr DA", "1hr RT", "2hr DA", "2hr RT"];

fetch("dashboard.json").then(r=>r.json()).then(d=>{
  const gm = d.groups_monthly || [];
  document.getElementById("updated").textContent =
    d.updated ? ("through "+d.updated) : "no data yet";
  if(!gm.length){ return; }

  const periods = [...new Set(gm.map(r=>r.period))].sort();
  const groups  = [...new Set(gm.map(r=>r.group))].sort();
  const valMw = (p,g) => { const r=gm.find(x=>x.period===p&&x.group===g); return r?r.avg_rev_per_mw:null; };

  // Monthly line — avg $/MW per group
  new Chart(line,{type:"line",
    data:{labels:periods, datasets:groups.map(g=>({
      label:label(g), data:periods.map(p=>valMw(p,g)),
      borderColor:(STYLE[g]||{}).c||"#aaa", borderDash:(STYLE[g]||{}).dash||[],
      borderWidth:2, tension:.25, pointRadius:2,
    }))},
    options:{plugins:{legend:{labels:{color:"#8b98a5",boxWidth:14}}},
      scales:{x:{ticks:{color:"#8b98a5"}},y:{ticks:{color:"#8b98a5",callback:fmt}}}}});

  // YTD DA/RT totals per group (sum across all months)
  const sums = {};
  gm.forEach(r=>{ const s=sums[r.group]||(sums[r.group]={da:0,rt:0});
    s.da+=r.da_rev||0; s.rt+=r.rt_rev||0; });

  function pie(canvas, prefix){
    const a = sums[prefix+" 1hr"]||{da:0,rt:0}, b = sums[prefix+" 2hr"]||{da:0,rt:0};
    const data = [a.da, a.rt, b.da, b.rt];
    const total = data.reduce((x,y)=>x+y,0) || 1;
    new Chart(canvas,{type:"pie",
      data:{labels:PIE_LABELS, datasets:[{data, backgroundColor:PIE_COLORS}]},
      options:{plugins:{legend:{position:"right",labels:{color:"#8b98a5",boxWidth:12}},
        tooltip:{callbacks:{label:c=>`${c.label}: ${fmt(c.raw)} (${(c.raw/total*100).toFixed(0)}%)`}}}}});
  }
  pie(henPie, "Hen");
  pie(peerPie, "Peer");

  // Leaderboard (latest month)
  const rows = d.leaderboard || [];
  let html="<table><tr><th>#</th><th>Battery</th><th>Owner</th><th>Dur</th><th>$/MW</th><th>DA $</th><th>RT $</th><th>Total $</th></tr>";
  rows.forEach((r,i)=>{ const hen=r.owner==="HEN";
    html+=`<tr><td>${i+1}</td><td class="${hen?'hen':''}">${r.name}</td>`+
          `<td>${r.owner}</td><td><span class="pill">${r.duration_class||''}</span></td>`+
          `<td>${fmt(r.total_rev_per_mw)}</td><td>${fmt(r.da_rev)}</td>`+
          `<td>${fmt(r.rt_rev)}</td><td>${fmt(r.total_rev)}</td></tr>`; });
  document.getElementById("board").innerHTML = html+"</table>";
}).catch(()=>{document.getElementById("updated").textContent="error loading dashboard.json";});
</script>
</body>
</html>
