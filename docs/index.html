<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HEN BESS — DART vs RT Backtest</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root { --bg:#0f1419; --card:#1a2129; --txt:#e6edf3; --mut:#8b98a5; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:18px 24px; border-bottom:1px solid #283039; }
  h1 { margin:0; font-size:17px; }
  .sub { color:var(--mut); margin-top:4px; font-size:13px; }
  .wrap { padding:20px 24px; display:grid; gap:20px; grid-template-columns:1fr 1fr; max-width:1200px; }
  .card { background:var(--card); border:1px solid #283039; border-radius:12px; padding:16px; }
  .card.full { grid-column:1 / -1; }
  h2 { margin:0 0 10px; font-size:12px; color:var(--mut); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .chartbox { position:relative; height:240px; }
  .chartbox.tall { height:300px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:right; padding:6px 9px; border-bottom:1px solid #283039; white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  .hen { color:#4f9dff; font-weight:600; }
  .pill { display:inline-block; font-size:11px; padding:1px 7px; border-radius:10px; background:#283039; }
  .scroll { max-height:420px; overflow:auto; }
</style>
</head>
<body>
<header>
  <h1>HEN Battery Backtest — DART vs RT (Energy + Ancillary Services)</h1>
  <div class="sub">DART = DA award × (DA − RT price) · RT = RT award × RT price · HEN vs ERCOT peers · <span id="updated">loading…</span></div>
</header>
<div class="wrap">
  <div class="card full"><h2>Average $/MW by group, monthly</h2><div class="chartbox tall"><canvas id="line"></canvas></div></div>
  <div class="card"><h2>HEN — YTD revenue by stream ($)</h2><div class="chartbox"><canvas id="henBar"></canvas></div></div>
  <div class="card"><h2>Peers — YTD revenue by stream ($)</h2><div class="chartbox"><canvas id="peerBar"></canvas></div></div>
  <div class="card full"><h2>Latest-month leaderboard ($/MW)</h2><div class="scroll"><div id="board"></div></div></div>
</div>
<script>
const fmt = n => (n==null||isNaN(n)) ? "—" : "$"+Number(n).toLocaleString(undefined,{maximumFractionDigits:0});
const STYLE = {
  "Hen 1hr":  {c:"#4f9dff", dash:[]},
  "Hen 2hr":  {c:"#7fc4ff", dash:[6,4]},
  "Peer 1hr": {c:"#ff8c42", dash:[]},
  "Peer 2hr": {c:"#ffb784", dash:[6,4]},
};
const label = g => g.replace("Hen","HEN").replace("Peer","Peers");
// Four revenue streams.
const STREAMS = ["dart_energy", "rt_energy", "dart_as", "rt_as"];
const STREAM_LABELS = ["DART Energy", "RT Energy", "DART AS", "RT AS"];
const STREAM_COLORS = ["#4f9dff", "#ff8c42", "#58c27d", "#c678dd"];
const NOASPECT = {responsive:true, maintainAspectRatio:false};

fetch("dashboard.json").then(r=>r.json()).then(d=>{
  const gm = d.groups_monthly || [];
  document.getElementById("updated").textContent =
    d.updated ? ("through "+d.updated) : "no data yet";
  if(!gm.length){ return; }

  const periods = [...new Set(gm.map(r=>r.period))].sort();
  const groups  = [...new Set(gm.map(r=>r.group))].sort();
  const valMw = (p,g) => { const r=gm.find(x=>x.period===p&&x.group===g); return r?r.avg_rev_per_mw:null; };

  new Chart(line,{type:"line",
    data:{labels:periods, datasets:groups.map(g=>({
      label:label(g), data:periods.map(p=>valMw(p,g)),
      borderColor:(STYLE[g]||{}).c||"#aaa", borderDash:(STYLE[g]||{}).dash||[],
      borderWidth:2, tension:.25, pointRadius:2,
    }))},
    options:{...NOASPECT, plugins:{legend:{labels:{color:"#8b98a5",boxWidth:14}}},
      scales:{x:{ticks:{color:"#8b98a5"}},y:{ticks:{color:"#8b98a5",callback:fmt}}}}});

  // Sum the four streams per fleet (across both durations)
  const fleet = {Hen:{}, Peer:{}};
  STREAMS.forEach(s=>{ fleet.Hen[s]=0; fleet.Peer[s]=0; });
  gm.forEach(r=>{ const f=r.group.startsWith("Hen")?"Hen":"Peer";
    STREAMS.forEach(s=> fleet[f][s]+=(r[s]||0)); });

  // Bar chart (not pie) so negative DART legs render below zero.
  function bar(canvas, f){
    const data = STREAMS.map(s=>fleet[f][s]);
    const tot = data.reduce((x,y)=>x+y,0);
    new Chart(canvas,{type:"bar",
      data:{labels:STREAM_LABELS, datasets:[{data, backgroundColor:STREAM_COLORS}]},
      options:{...NOASPECT, plugins:{legend:{display:false},
        title:{display:true,text:"Total "+fmt(tot),color:"#8b98a5",font:{size:12}},
        tooltip:{callbacks:{label:c=>fmt(c.raw)}}},
        scales:{x:{ticks:{color:"#8b98a5"}},
          y:{ticks:{color:"#8b98a5",callback:fmt},grid:{color:c=>c.tick.value===0?"#5a6b7a":"#283039"}}}}});
  }
  bar(henBar, "Hen");
  bar(peerBar, "Peer");

  const rows = d.leaderboard || [];
  let html="<table><tr><th>#</th><th>Battery</th><th>Owner</th><th>Dur</th><th>$/MW</th>"
         +"<th>DART E</th><th>RT E</th><th>DART AS</th><th>RT AS</th><th>Total $</th></tr>";
  rows.forEach((r,i)=>{ const hen=r.owner==="HEN";
    html+=`<tr><td>${i+1}</td><td class="${hen?'hen':''}">${r.name}</td>`+
          `<td>${r.owner}</td><td><span class="pill">${r.duration_class||''}</span></td>`+
          `<td>${fmt(r.total_rev_per_mw)}</td><td>${fmt(r.dart_energy)}</td>`+
          `<td>${fmt(r.rt_energy)}</td><td>${fmt(r.dart_as)}</td>`+
          `<td>${fmt(r.rt_as)}</td><td>${fmt(r.total_rev)}</td></tr>`; });
  document.getElementById("board").innerHTML = html+"</table>";
}).catch(()=>{document.getElementById("updated").textContent="error loading dashboard.json";});
</script>
</body>
</html>
